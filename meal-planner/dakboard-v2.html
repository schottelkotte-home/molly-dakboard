<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Meal Planner — DAKboard v2</title>
<style>
:root{--text:#252525;--muted:#777;--line:#e5e5e5;--surface:#fff;--done:#dedede}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.board{width:100%;background:var(--surface);border-radius:14px;padding:14px 16px}
.table{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin:0 0 10px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr)}
.row+.row{border-top:1px solid var(--line)}
.cell{min-width:0;border-right:1px solid var(--line);padding:16px 14px;font-size:56px;line-height:1.08;white-space:pre-wrap;overflow-wrap:anywhere}
.cell:last-child{border-right:0}
.head .cell{background:#f4f4f4;color:#555;font-weight:800;font-size:28px;padding:10px 12px;text-align:center}
.label{background:#fafafa;color:#666;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;padding:10px 6px;white-space:nowrap;overflow-wrap:normal}
.meal{min-height:90px;font-weight:750;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background-color .12s ease,color .12s ease;display:flex;align-items:center}
.meal:empty{cursor:default}
.meal.done{background:var(--done);color:#777}
.empty-note{padding:14px;color:var(--muted);font-size:18px;text-align:center}
@media (max-width:600px){
  .board{padding:10px}
  .row{grid-template-columns:85px minmax(0,1fr)}
  .cell{font-size:44px;padding:12px 10px}
  .head .cell{font-size:24px}
  .label{font-size:24px}
  .meal{min-height:78px}
}
</style>

</head>
<body>
<main class="board" aria-label="Meal planner DAKboard view"><div id="syncStatus" role="status" style="display:none;font-size:16px;color:#777;margin:0 0 8px"></div>
  <section class="table">
    <div class="row head"><div class="cell"></div><div class="cell">Dinner</div></div>
    <div id="mealRows"></div>
  </section>
  
</main>
<script>
(function(){
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var ABBR={Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thur",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
var CHECK_KEY="mealPlannerDakDoneV1";
var current=null;
var checks={};
try{checks=JSON.parse(localStorage.getItem(CHECK_KEY)||"{}")}catch(e){}
function loadRemote(){
  fetch("plan.json?ts="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(plan){
      if(!plan||!plan.meals)throw new Error("Invalid plan");
      current=plan;
      document.getElementById("syncStatus").style.display="none";
      render();
    })
    .catch(function(){
      var el=document.getElementById("syncStatus");
      el.textContent="Could not update meal plan";
      el.style.display="block";
    });
}
function order(s){var i=DAYS.indexOf(s.start);return DAYS.slice(i).concat(DAYS.slice(0,i))}
function setDone(el,key){el.classList.toggle("done",!!checks[key])}
function makeMeal(text,key){var c=document.createElement("div");c.className="cell meal";c.textContent=text||"";c.dataset.check=key;setDone(c,key);c.addEventListener("click",function(){if(!c.textContent.trim())return;checks[key]=!checks[key];try{localStorage.setItem(CHECK_KEY,JSON.stringify(checks))}catch(e){}setDone(c,key)});return c}
function render(){var s=current,rows=document.getElementById("mealRows");rows.innerHTML="";if(!s)return;order(s).forEach(function(day){var r=document.createElement("div");r.className="row";var d=document.createElement("div");d.className="cell label";d.textContent=ABBR[day];r.appendChild(d);r.appendChild(makeMeal(s.meals[day].dinner,day+"-dinner"));rows.appendChild(r)})}
document.addEventListener("visibilitychange",function(){if(!document.hidden)loadRemote()});
window.addEventListener("focus",loadRemote);
loadRemote();
setInterval(loadRemote,60000);
})();
</script>
</body>
</html>
