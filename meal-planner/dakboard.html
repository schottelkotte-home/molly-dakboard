<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Meal Planner — DAKboard</title>
<style>
:root{--text:#252525;--muted:#777;--line:#e5e5e5;--surface:#fff;--done:#dedede}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.board{width:100%;background:var(--surface);border-radius:14px;padding:14px 16px}
.table{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin:0 0 10px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr)}
.small .row{grid-template-columns:58px minmax(0,1fr)}
.row+.row{border-top:1px solid var(--line)}
.cell{min-width:0;border-right:1px solid var(--line);padding:10px 9px;font-size:22px;line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere}
.cell:last-child{border-right:0}
.head .cell{background:#f4f4f4;color:#555;font-weight:800;font-size:17px;padding:8px 9px;text-align:center}
.label{background:#fafafa;color:#666;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;padding:8px 5px}
.meal{min-height:64px;font-weight:650;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background-color .12s ease,color .12s ease}
.meal:empty{cursor:default}
.meal.done{background:var(--done);color:#777}
.empty-note{padding:14px;color:var(--muted);font-size:18px;text-align:center}
@media (max-width:600px){
  .board{padding:10px}
  .row{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr)}
  .small .row{grid-template-columns:50px minmax(0,1fr)}
  .cell{font-size:18px;padding:8px 7px}
  .head .cell,.label{font-size:14px}
  .meal{min-height:54px}
}
</style>
</head>
<body>
<main class="board" aria-label="Meal planner DAKboard view">
  <section class="table">
    <div class="row head"><div class="cell"></div><div class="cell">Lunch</div><div class="cell">Dinner</div></div>
    <div id="mealRows"></div>
  </section>
  <section class="table small">
    <div class="row head"><div class="cell"></div><div class="cell">Breakfast</div></div>
    <div class="row"><div class="cell label">Molly</div><div class="cell meal" id="bm" data-check="breakfast-Molly"></div></div>
    <div class="row"><div class="cell label">Rob</div><div class="cell meal" id="br" data-check="breakfast-Rob"></div></div>
  </section>
  <section class="table small">
    <div class="row head"><div class="cell"></div><div class="cell">Snack</div></div>
    <div class="row"><div class="cell label">Jonah</div><div class="cell meal" id="sj" data-check="snack-Jonah"></div></div>
  </section>
</main>
<script>
(function(){
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var ABBR={Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thur",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
var DATA_KEY="mealPlannerV3",CHECK_KEY="mealPlannerDakDoneV1";
var checks={};
try{checks=JSON.parse(localStorage.getItem(CHECK_KEY)||"{}")}catch(e){checks={}}
function blank(){var m={};DAYS.forEach(function(d){m[d]={lunch:"",dinner:""}});return{start:"Saturday",meals:m,breakfast:{Molly:"",Rob:""},snack:{Jonah:""}}}
function load(){var s=blank();try{var raw=localStorage.getItem(DATA_KEY);if(raw){var p=JSON.parse(raw);s.start=DAYS.indexOf(p.start)>=0?p.start:"Saturday";DAYS.forEach(function(d){s.meals[d].lunch=(p.meals&&p.meals[d]&&p.meals[d].lunch)||"";s.meals[d].dinner=(p.meals&&p.meals[d]&&p.meals[d].dinner)||""});s.breakfast.Molly=(p.breakfast&&p.breakfast.Molly)||"";s.breakfast.Rob=(p.breakfast&&p.breakfast.Rob)||"";s.snack.Jonah=(p.snack&&p.snack.Jonah)||""}}catch(e){}return s}
function order(s){var i=DAYS.indexOf(s.start);return DAYS.slice(i).concat(DAYS.slice(0,i))}
function setDone(el,key){el.classList.toggle("done",!!checks[key])}
function makeMeal(text,key){var c=document.createElement("div");c.className="cell meal";c.textContent=text||"";c.dataset.check=key;setDone(c,key);c.addEventListener("click",function(){if(!c.textContent.trim())return;checks[key]=!checks[key];try{localStorage.setItem(CHECK_KEY,JSON.stringify(checks))}catch(e){}setDone(c,key)});return c}
function bindStatic(el,text,key){el.textContent=text||"";setDone(el,key);if(!el.dataset.bound){el.dataset.bound="1";el.addEventListener("click",function(){if(!el.textContent.trim())return;checks[key]=!checks[key];try{localStorage.setItem(CHECK_KEY,JSON.stringify(checks))}catch(e){}setDone(el,key)})}}
function render(){var s=load(),rows=document.getElementById("mealRows");rows.innerHTML="";order(s).forEach(function(day){var r=document.createElement("div");r.className="row";var d=document.createElement("div");d.className="cell label";d.textContent=ABBR[day];r.appendChild(d);r.appendChild(makeMeal(s.meals[day].lunch,day+"-lunch"));r.appendChild(makeMeal(s.meals[day].dinner,day+"-dinner"));rows.appendChild(r)});bindStatic(document.getElementById("bm"),s.breakfast.Molly,"breakfast-Molly");bindStatic(document.getElementById("br"),s.breakfast.Rob,"breakfast-Rob");bindStatic(document.getElementById("sj"),s.snack.Jonah,"snack-Jonah")}
window.addEventListener("storage",render);
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
window.addEventListener("focus",render);
render();
})();
</script>
</body>
</html>
