<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Meal Planner — DAKboard</title>
<style>
:root{--text:#252525;--muted:#777;--line:#e5e5e5;--surface:#fff;--done:#dedede}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.board{width:100%;background:var(--surface);border-radius:14px;padding:14px 16px}
.table{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin:0 0 10px}
.row{display:grid;grid-template-columns:72px minmax(0,1fr)}
.row+.row{border-top:1px solid var(--line)}
.cell{min-width:0;border-right:1px solid var(--line);padding:16px 14px;font-size:56px;line-height:1.08;white-space:pre-wrap;overflow-wrap:anywhere}
.cell:last-child{border-right:0}
.head .cell{background:#f4f4f4;color:#555;font-weight:800;font-size:28px;padding:10px 12px;text-align:center}
.label{background:#fafafa;color:#666;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;padding:10px 6px}
.meal{min-height:90px;font-weight:750;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background-color .12s ease,color .12s ease;display:flex;align-items:center}
.meal:empty{cursor:default}
.meal.done{background:var(--done);color:#777}
.empty-note{padding:14px;color:var(--muted);font-size:18px;text-align:center}
@media (max-width:600px){
  .board{padding:10px}
  .row{grid-template-columns:58px minmax(0,1fr)}
  .cell{font-size:44px;padding:12px 10px}
  .head .cell{font-size:24px}
  .label{font-size:24px}
  .meal{min-height:78px}
}
</style>
<script src="shared-config.js"></script>
</head>
<body>
<main class="board" aria-label="Meal planner DAKboard view"><div id="syncStatus" style="font-size:16px;color:#777;margin:0 0 8px"></div>
  <section class="table">
    <div class="row head"><div class="cell"></div><div class="cell">Dinner</div></div>
    <div id="mealRows"></div>
  </section>
  
</main>
<script>
(function(){
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var ABBR={Monday:"Mon",Tuesday:"Tue",Wednesday:"Wed",Thursday:"Thur",Friday:"Fri",Saturday:"Sat",Sunday:"Sun"};
var DATA_KEY="mealPlannerV3",CHECK_KEY="mealPlannerDakDoneV1";
var ENDPOINT=(window.MEAL_PLANNER_SHARED_ENDPOINT||"").trim();
var current=load();
function jsonp(params,cb){
  if(!ENDPOINT){if(cb)cb(null);return}
  var name="mealcb_"+Date.now()+"_"+Math.floor(Math.random()*100000),s=document.createElement("script");
  params.callback=name;
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
  window[name]=function(data){try{if(cb)cb(data)}finally{delete window[name];s.remove()}};
  s.onerror=function(){delete window[name];s.remove();if(cb)cb(null)};
  s.src=ENDPOINT+(ENDPOINT.indexOf("?")>=0?"&":"?")+q;document.head.appendChild(s)
}
function normalize(p){
  var s=blank();
  s.start=DAYS.indexOf(p&&p.start)>=0?p.start:"Saturday";
  DAYS.forEach(function(d){s.meals[d].lunch=(p&&p.meals&&p.meals[d]&&p.meals[d].lunch)||"";s.meals[d].dinner=(p&&p.meals&&p.meals[d]&&p.meals[d].dinner)||""});
  s.breakfast.Molly=(p&&p.breakfast&&p.breakfast.Molly)||"";s.breakfast.Rob=(p&&p.breakfast&&p.breakfast.Rob)||"";s.snack.Jonah=(p&&p.snack&&p.snack.Jonah)||"";
  return s
}
function loadRemote(){
  var syncStatus=document.getElementById("syncStatus");
  if(!ENDPOINT){syncStatus.textContent="No shared endpoint configured";render();return}
  syncStatus.textContent="Loading shared meals…";
  jsonp({action:"load",ts:Date.now()},function(data){
    if(data&&data.ok&&data.plan){
      current=normalize(data.plan);
      try{localStorage.setItem(DATA_KEY,JSON.stringify(current))}catch(e){}
      syncStatus.textContent="Shared meals loaded";
    }else if(data&&data.ok&&!data.plan){
      syncStatus.textContent="Shared backend is reachable, but no meal plan has been saved yet";
    }else{
      syncStatus.textContent="Could not load shared meals";
    }
    render()
  })
}
var checks={};
try{checks=JSON.parse(localStorage.getItem(CHECK_KEY)||"{}")}catch(e){checks={}}
function blank(){var m={};DAYS.forEach(function(d){m[d]={lunch:"",dinner:""}});return{start:"Saturday",meals:m,breakfast:{Molly:"",Rob:""},snack:{Jonah:""}}}
function load(){var s=blank();try{var raw=localStorage.getItem(DATA_KEY);if(raw){var p=JSON.parse(raw);s.start=DAYS.indexOf(p.start)>=0?p.start:"Saturday";DAYS.forEach(function(d){s.meals[d].lunch=(p.meals&&p.meals[d]&&p.meals[d].lunch)||"";s.meals[d].dinner=(p.meals&&p.meals[d]&&p.meals[d].dinner)||""});s.breakfast.Molly=(p.breakfast&&p.breakfast.Molly)||"";s.breakfast.Rob=(p.breakfast&&p.breakfast.Rob)||"";s.snack.Jonah=(p.snack&&p.snack.Jonah)||""}}catch(e){}return s}
function order(s){var i=DAYS.indexOf(s.start);return DAYS.slice(i).concat(DAYS.slice(0,i))}
function setDone(el,key){el.classList.toggle("done",!!checks[key])}
function makeMeal(text,key){var c=document.createElement("div");c.className="cell meal";c.textContent=text||"";c.dataset.check=key;setDone(c,key);c.addEventListener("click",function(){if(!c.textContent.trim())return;checks[key]=!checks[key];try{localStorage.setItem(CHECK_KEY,JSON.stringify(checks))}catch(e){}setDone(c,key)});return c}
function bindStatic(el,text,key){el.textContent=text||"";setDone(el,key);if(!el.dataset.bound){el.dataset.bound="1";el.addEventListener("click",function(){if(!el.textContent.trim())return;checks[key]=!checks[key];try{localStorage.setItem(CHECK_KEY,JSON.stringify(checks))}catch(e){}setDone(el,key)})}}
function render(){var s=current||load(),rows=document.getElementById("mealRows");rows.innerHTML="";order(s).forEach(function(day){var r=document.createElement("div");r.className="row";var d=document.createElement("div");d.className="cell label";d.textContent=ABBR[day];r.appendChild(d);r.appendChild(makeMeal(s.meals[day].dinner,day+"-dinner"));rows.appendChild(r)})}
window.addEventListener("storage",function(){current=load();render()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)loadRemote()});
window.addEventListener("focus",loadRemote);
loadRemote();
setInterval(loadRemote,60000);
})();
</script>
</body>
</html>
