<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCC Feed Diagnostic</title><style>body{font-family:system-ui,sans-serif;padding:20px;font-size:20px}pre{white-space:pre-wrap;word-break:break-word}.ok{color:green}.bad{color:#a00}.build{font-size:16px;color:#777;margin-bottom:16px}</style></head><body><h1>FCC Feed Diagnostic</h1><div class="build">BUILD FCC-DEBUG-02</div><pre id="out">Loading…</pre><script>
const out=document.getElementById('out');
const now=new Date();
const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+3,23,59,59,999);
const key=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/teams/18267/schedule?dates=${key(start)}-${key(end)}`;
const dateOnly=s=>{const d=new Date(s);return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
(async()=>{try{const r=await fetch(url,{cache:'no-store'});const data=await r.json();const endDay=new Date(end.getFullYear(),end.getMonth(),end.getDate());const events=(data.events||[]).filter(e=>{const d=dateOnly(e.date);return d>=start&&d<=endDay});let lines=[];lines.push(`Request: ${url}`);lines.push(`HTTP: ${r.status}`);lines.push(`Events returned by ESPN: ${(data.events||[]).length}`);lines.push(`Events in local five-day window: ${events.length}`);if(!events.length)lines.push('\nNO FCC EVENTS FELL IN THE CURRENT WINDOW.');for(const e of events){const c=e.competitions?.[0];const cs=c?.competitors||[];lines.push(`\nEVENT: ${e.name||'(no name)'}`);lines.push(`date: ${e.date}`);lines.push(`local date: ${new Date(e.date).toLocaleString()}`);lines.push(`status: ${c?.status?.type?.name||e.status?.type?.name||'(none)'}`);for(const x of cs){const score=typeof x.score==='object'?(x.score.displayValue??x.score.value??JSON.stringify(x.score)):x.score??'';const logo=x.team?.logo||x.team?.logos?.[0]?.href||'(no logo field)';lines.push(`team: ${x.team?.displayName||x.team?.name||'(none)'} | id=${x.team?.id} | homeAway=${x.homeAway} | score=${score}`);lines.push(`logo: ${logo}`)}const fcc=cs.find(x=>String(x.team?.id)==='18267');lines.push(`FCC ID MATCH: ${fcc?'YES':'NO'}`);lines.push(`OUR CURRENT CODE WOULD ACCEPT TEAM: ${fcc?'YES':'NO'}`)}out.innerHTML=`<span class="ok">Diagnostic complete</span>\n\n${lines.join('\n')}`;}catch(err){out.innerHTML=`<span class="bad">ERROR</span>\n${err.stack||err}`}})();
</script></body></html>
