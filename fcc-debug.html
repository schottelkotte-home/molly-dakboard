<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCC Feed Diagnostic</title><style>body{font-family:system-ui,sans-serif;padding:20px;font-size:20px}pre{white-space:pre-wrap;word-break:break-word}.ok{color:green}.bad{color:#a00}.build{font-size:16px;color:#777;margin-bottom:16px}</style></head><body><h1>FCC Feed Diagnostic</h1><div class="build">BUILD FCC-DEBUG-03</div><pre id="out">Loading…</pre><script>
const out=document.getElementById('out');const now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+3,23,59,59,999);const key=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/teams/18267/schedule?dates=${key(start)}-${key(end)}`;
(async()=>{try{const r=await fetch(url,{cache:'no-store'});const data=await r.json();const events=data.events||[];let lines=[];lines.push(`Request: ${url}`);lines.push(`HTTP: ${r.status}`);lines.push(`Events returned by ESPN: ${events.length}`);lines.push(`Browser local time: ${now.toString()}`);lines.push('');events.forEach((e,i)=>{const d=new Date(e.date);const c=e.competitions?.[0];const cs=c?.competitors||[];const fcc=cs.find(x=>String(x.team?.id)==='18267');const opp=cs.find(x=>String(x.team?.id)!=='18267');lines.push(`${i+1}. ${e.name||'(no name)'}`);lines.push(`   ESPN date: ${e.date}`);lines.push(`   Browser local: ${d.toString()}`);lines.push(`   Local date key: ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);lines.push(`   Status: ${c?.status?.type?.name||e.status?.type?.name||'(none)'}`);lines.push(`   FCC ID: ${fcc?.team?.id||'(not found)'} | Opponent: ${opp?.team?.displayName||'(none)'}`);lines.push(`   FCC score raw: ${fcc?.score===undefined?'(none)':JSON.stringify(fcc.score)}`);lines.push('');});out.innerHTML=`<span class="ok">Diagnostic complete</span>\n\n${lines.join('\n')}`;}catch(err){out.innerHTML=`<span class="bad">ERROR</span>\n${err.stack||err}`}})();</script></body></html>
