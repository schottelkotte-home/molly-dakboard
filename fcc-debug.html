<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCC Feed Diagnostic</title><style>body{font-family:system-ui,sans-serif;padding:20px;font-size:20px}pre{white-space:pre-wrap;word-break:break-word} .ok{color:green}.bad{color:#a00}</style></head><body><h1>FCC Feed Diagnostic</h1><pre id="out">Loading…</pre><script>
const out=document.getElementById('out');
const now=new Date();
const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+3,23,59,59,999);
const key=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const wantedStart=key(start),wantedEnd=key(end);
const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/teams/18267/schedule?dates=${wantedStart}-${wantedEnd}`;
(async()=>{try{const r=await fetch(url,{cache:'no-store'});const data=await r.json();const events=data.events||[];let lines=[];lines.push(`Request: ${url}`);lines.push(`HTTP: ${r.status}`);lines.push(`Events returned: ${events.length}`);for(const e of events){const c=e.competitions?.[0];const cs=c?.competitors||[];lines.push(`\nEVENT: ${e.name||'(no name)'}`);lines.push(`date: ${e.date}`);lines.push(`status: ${c?.status?.type?.name||e.status?.type?.name||'(none)'}`);for(const x of cs){lines.push(`team: ${x.team?.displayName||x.team?.name||'(none)'} | id=${x.team?.id} | homeAway=${x.homeAway} | score=${x.score??''}`);lines.push(`logo: ${x.team?.logo||x.team?.logos?.[0]?.href||'(no logo field)'}`)}const fcc=cs.find(x=>String(x.team?.id)==='18267');lines.push(`FCC ID MATCH: ${fcc?'YES':'NO'}`);lines.push(`DATE IN CURRENT 5-DAY WINDOW: ${e.date>=start.toISOString()&&e.date<=end.toISOString()?'YES':'CHECK TIMEZONE'}`)}out.innerHTML=`<span class="ok">Diagnostic complete</span>\n\n${lines.join('\n')}`;}catch(err){out.innerHTML=`<span class="bad">ERROR</span>\n${err.stack||err}`}})();
</script></body></html>
